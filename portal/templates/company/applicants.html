{% extends 'base.html' %}

{% block content %}

<h2 class="mb-4">

    Job Applicants

</h2>

<table class="table table-bordered table-hover">

    <thead class="table-dark">

        <tr>

            <th>Student</th>

            <th>Job</th>

            <th>Status</th>

            <th>Actions</th>

        </tr>

    </thead>

    <tbody>

    {% for app in applications %}

    <tr>

        <td>

            {{ app.student.user.username }}

        </td>

        <td>

            {{ app.job.title }}

        </td>

        <td>

            {{ app.status }}

        </td>

        <td>

            <a href="{% url 'update_status' app.id 'Shortlisted' %}"
               class="btn btn-success btn-sm">

               Shortlist

            </a>

            <a href="{% url 'update_status' app.id 'Rejected' %}"
               class="btn btn-danger btn-sm">

               Reject

            </a>

            <a href="{% url 'update_status' app.id 'Selected' %}"
               class="btn btn-primary btn-sm">

               Select

            </a>

        </td>

    </tr>

    {% empty %}

    <tr>

        <td colspan="4">

            No Applicants Yet

        </td>

    </tr>

    {% endfor %}

    </tbody>

</table>

{% endblock %}
