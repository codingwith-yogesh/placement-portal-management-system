{% extends 'base.html' %}

{% block content %}

<h2 class="mb-4">
    Analytics Dashboard
</h2>

<div class="row">

    <div class="col-md-3">

        <div class="card text-center shadow">

            <div class="card-body">

                <h1>{{ students }}</h1>

                <h5>Total Students</h5>

            </div>

        </div>

    </div>

    <div class="col-md-3">

        <div class="card text-center shadow">

            <div class="card-body">

                <h1>{{ companies }}</h1>

                <h5>Total Companies</h5>

            </div>

        </div>

    </div>

    <div class="col-md-3">

        <div class="card text-center shadow">

            <div class="card-body">

                <h1>{{ jobs }}</h1>

                <h5>Total Jobs</h5>

            </div>

        </div>

    </div>

    <div class="col-md-3">

        <div class="card text-center shadow">

            <div class="card-body">

                <h1>{{ applications }}</h1>

                <h5>Total Applications</h5>

            </div>

        </div>

    </div>

</div>

{% endblock %}
