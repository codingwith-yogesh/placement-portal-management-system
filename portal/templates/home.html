{% extends 'base.html' %}

{% block content %}

<div class="text-center">

    <h1 class="display-4 fw-bold">
        Placement Portal
    </h1>

    <p class="lead">
        Connect Students and Companies
    </p>

</div>

<div class="row mt-5">

    <div class="col-md-4">

        <div class="card shadow">

            <div class="card-body text-center">

                <h3>Student</h3>

                <a href="/register/"
                   class="btn btn-success mt-2">
                    Register
                </a>

                <a href="/login/"
                   class="btn btn-primary mt-2">
                    Login
                </a>

            </div>

        </div>

    </div>

    <div class="col-md-4">

        <div class="card shadow">

            <div class="card-body text-center">

                <h3>Company</h3>

                <a href="/company/register/"
                   class="btn btn-success mt-2">
                    Register
                </a>

                <a href="/login/"
                   class="btn btn-primary mt-2">
                    Login
                </a>

            </div>

        </div>

    </div>

    <div class="col-md-4">

        <div class="card shadow">

            <div class="card-body text-center">

                <h3>Admin</h3>

                <a href="/admin/"
                   class="btn btn-dark mt-2">
                    Login
                </a>

            </div>

        </div>

    </div>

</div>

{% endblock %}
