{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card shadow">

            <div class="card-header bg-info text-white">

                <h3>

                    Upload Resume

                </h3>

            </div>

            <div class="card-body">

                <form method="POST"
                      enctype="multipart/form-data">

                    {% csrf_token %}

                    {{ form.as_p }}

                    <button
                        class="btn btn-success">

                        Upload Resume

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
